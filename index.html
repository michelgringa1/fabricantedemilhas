    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3L9QNF0M6P"></script>
    <!-- Consent Mode v2: o consentimento nasce NEGADO e o page_view sai sem cookies. O aviso
         (script abaixo) so promove analytics_storage para "granted" se o visitante aceitar.
         Nao ha anuncios: ad_storage, ad_user_data e ad_personalization ficam sempre negados. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      try { if (localStorage.getItem('fm_consent') === 'granted') gtag('consent', 'update', { analytics_storage: 'granted' }); } catch (e) {}
      gtag('js', new Date());
      gtag('config', 'G-3L9QNF0M6P');
    </script>
    <script>
      (function () {
        var KEY = 'fm_consent';
        var box = null;
        function read() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
        function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
        function apply(granted) {
          if (typeof gtag !== 'function') return;
          gtag('consent', 'update', { analytics_storage: granted ? 'granted' : 'denied' });
        }
        function close() { if (box && box.parentNode) box.parentNode.removeChild(box); box = null; }
        function open() {
          // o pre-render roda em Chrome headless: o aviso nao pode entrar no HTML salvo
          if (box || /HeadlessChrome/.test(navigator.userAgent)) return;
          box = document.createElement('div');
          box.className = 'cookie-box';
          box.setAttribute('role', 'dialog');
          box.setAttribute('aria-label', 'Aviso de cookies');
          box.innerHTML =
            '<p>Usamos um cookie de an\u00e1lise (Google Analytics) para medir as visitas. Voc\u00ea pode aceitar ou recusar. <a href="/cookies/">Saiba mais</a></p>' +
            '<div class="cookie-actions"><button type="button" class="cookie-no">Recusar</button><button type="button" class="cookie-yes">Aceitar</button></div>';
          box.querySelector('.cookie-yes').addEventListener('click', function () { save('granted'); apply(true); close(); });
          box.querySelector('.cookie-no').addEventListener('click', function () { save('denied'); apply(false); close(); });
          document.body.appendChild(box);
        }
        function init() {
          if (!read()) open();
          // botao "Preferencias de cookies" do rodape (renderizado depois pelo React)
          document.addEventListener('click', function (e) {
            var t = e.target;
            if (t && t.closest && t.closest('[data-cookie-settings]')) open();
          });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
      })();
    </script>
