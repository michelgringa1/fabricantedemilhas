name: diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: variantes
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          variante() {
            rm -rf dist .parcel-cache
            pnpm exec parcel build index.html --dist-dir dist --no-source-maps > /dev/null 2>&1
            node scripts/static-assets.mjs > /dev/null 2>&1
            node scripts/diag-render.mjs / "$1"
            node scripts/diag-render.mjs /vender-milhas-aereas/ "$1"
          }
          variante v0-novo-como-esta
          git stash -u -q || true
          git checkout -q 338201e -- src
          variante v1-src-antigo
          git checkout -q HEAD -- src
          rm -rf public/api
          variante v2-sem-public-api
